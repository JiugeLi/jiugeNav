<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe1f5"/>
      <stop offset="0.6" stop-color="#e8f0fa"/>
      <stop offset="1" stop-color="#f3f7fc"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9dcee"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.3" r="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f93a6"/>
      <stop offset="1" stop-color="#8fb0c2"/>
    </linearGradient>
    <g id="pine">
      <path d="M0 -46 L12 -18 L6 -18 L16 2 L-16 2 L-6 -18 L-12 -18 Z"/>
      <rect x="-2" y="2" width="4" height="7"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#sun)"/>

  <!-- 远山 -->
  <path d="M300 300 L420 230 L500 255 L600 180 L690 240 L760 215 L860 120 L960 210 L1040 175 L1120 225 L1200 200 L1200 300 Z" fill="#a9c2de" opacity="0.8"/>
  <!-- 中景山 -->
  <path d="M520 300 L620 255 L700 270 L790 220 L880 262 L960 238 L1060 270 L1200 245 L1200 300 Z" fill="#7f9fc2" opacity="0.8"/>

  <!-- 右侧林地 -->
  <path d="M960 300 C1010 262 1080 240 1200 232 L1200 300 Z" fill="url(#hill)"/>
  <g fill="#3f6a63">
    <use href="#pine" transform="translate(1010 284) scale(0.8)"/>
    <use href="#pine" transform="translate(1040 276) scale(1)"/>
    <use href="#pine" transform="translate(1072 268) scale(1.25)"/>
    <use href="#pine" transform="translate(1150 258) scale(1.5)"/>
    <use href="#pine" transform="translate(1182 252) scale(1.2)"/>
  </g>

  <!-- 湖边小屋 -->
  <g transform="translate(1086 262)">
    <rect x="0" y="12" width="58" height="26" fill="#c99a72"/>
    <rect x="8" y="18" width="12" height="12" fill="#f4e3c9"/>
    <rect x="30" y="18" width="20" height="12" fill="#f4e3c9"/>
    <path d="M-8 14 L29 -4 L66 14 Z" fill="#8a5d43"/>
    <rect x="-18" y="38" width="96" height="4" fill="#9a7458"/>
  </g>

  <!-- 湖面 -->
  <rect y="300" width="1200" height="120" fill="url(#lake)"/>
  <g opacity="0.22" transform="translate(0 600) scale(1 -1)">
    <path d="M520 300 L620 255 L700 270 L790 220 L880 262 L960 238 L1060 270 L1200 245 L1200 300 Z" fill="#6f93b4"/>
    <path d="M960 300 C1010 262 1080 240 1200 232 L1200 300 Z" fill="#3f6a63"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round">
    <path d="M640 330 H720"/>
    <path d="M820 352 H930"/>
    <path d="M1000 338 H1060"/>
    <path d="M700 378 H780"/>
  </g>
</svg>
