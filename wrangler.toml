name = "sololink"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Nuxt (Nitro) 构建产物
main = ".output/server/index.mjs"
assets = { directory = ".output/public", binding = "ASSETS" }

routes = [
  { pattern = "sololink.jiuge.ai", custom_domain = true },
  # 旧域名保留为别名，避免已有书签失效
  { pattern = "nav.jiuge.ai", custom_domain = true },
]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "sololink"
database_id = "fa6a11cf-06e4-4acb-a6f1-0b93eca38e31"
migrations_dir = "drizzle"
